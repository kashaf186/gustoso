<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="warmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <filter id="heroShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#9a3412" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="600" height="500" rx="24" fill="url(#warmBg)"/>
  <!-- Decorative background circles -->
  <circle cx="480" cy="120" r="160" fill="#fed7aa" opacity="0.4"/>
  <circle cx="100" cy="380" r="120" fill="#fdba74" opacity="0.25"/>
  <!-- Central Gourmet Cooking Scene -->
  <!-- Chef Pan with Sautéed Pasta and Fire / Steam -->
  <g transform="translate(160, 110)" filter="url(#heroShadow)">
    <!-- Pan handle -->
    <path d="M-50 170 L40 180" stroke="#292524" stroke-width="14" stroke-linecap="round"/>
    <!-- Heavy Iron Skillet / Saute Pan -->
    <ellipse cx="140" cy="190" rx="140" ry="70" fill="#1c1917"/>
    <ellipse cx="140" cy="180" rx="132" ry="60" fill="#292524"/>
    <!-- Rich Simmering Sauce & Pasta inside pan -->
    <ellipse cx="140" cy="180" rx="120" ry="52" fill="#c2410c"/>
    <!-- Pasta swirls -->
    <path d="M70 170 Q110 145 150 175 T210 165" stroke="#fde047" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M90 190 Q140 170 180 195 T230 180" stroke="#fde047" stroke-width="7" fill="none" stroke-linecap="round"/>
    <!-- Fresh Tomatoes and Basil in Pan -->
    <circle cx="105" cy="165" r="12" fill="#ef4444"/>
    <circle cx="180" cy="175" r="14" fill="#dc2626"/>
    <circle cx="150" cy="195" r="10" fill="#ef4444"/>
    <path d="M115 160 C125 145 138 155 130 168 Z" fill="#15803d"/>
    <path d="M190 165 C200 152 212 162 205 172 Z" fill="#22c55e"/>
    <!-- Rising Golden Steam Trails -->
    <path d="M100 130 Q90 90 120 60 T100 20" stroke="#ea580c" stroke-width="3" fill="none" opacity="0.6" stroke-linecap="round"/>
    <path d="M150 120 Q165 75 140 40 T160 10" stroke="#ea580c" stroke-width="4" fill="none" opacity="0.8" stroke-linecap="round"/>
    <path d="M200 130 Q210 85 180 50 T200 15" stroke="#ea580c" stroke-width="3" fill="none" opacity="0.6" stroke-linecap="round"/>
  </g>
  <!-- Floating Quality Stamp Badge -->
  <g transform="translate(420, 310)" filter="url(#heroShadow)">
    <circle cx="45" cy="45" r="45" fill="#9a3412"/>
    <circle cx="45" cy="45" r="39" fill="none" stroke="#fed7aa" stroke-width="2" stroke-dasharray="4 2"/>
    <text x="45" y="38" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffedd5" text-anchor="middle">100% ARTISAN</text>
    <text x="45" y="52" font-family="sans-serif" font-size="9" font-weight="600" fill="#fed7aa" text-anchor="middle">FRESH DAILY</text>
    <text x="45" y="66" font-family="sans-serif" font-size="8" font-weight="500" fill="#ffedd5" text-anchor="middle">★ ★ ★ ★ ★</text>
  </g>
</svg>
