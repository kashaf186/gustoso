<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="ramekinGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </radialGradient>
    <radialGradient id="souffleCake" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="60%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </radialGradient>
    <filter id="sfShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#fbf9f5"/>
  <!-- Underplate -->
  <circle cx="200" cy="180" r="110" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="2" filter="url(#sfShadow)"/>
  <!-- Scoop of Vanilla Gelato on the side -->
  <circle cx="255" cy="170" r="28" fill="#fffbeb" stroke="#fef08a" stroke-width="2" filter="url(#sfShadow)"/>
  <circle cx="260" cy="165" r="1" fill="#451a03"/>
  <circle cx="250" cy="175" r="1" fill="#451a03"/>
  <!-- Ceramic Ramekin -->
  <g transform="translate(115, 95)" filter="url(#sfShadow)">
    <!-- Ramekin Body -->
    <path d="M20 75 L30 145 C30 155 110 155 110 145 L120 75 Z" fill="url(#ramekinGrad)" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Vertical Ramekin Fluting lines -->
    <line x1="45" y1="78" x2="52" y2="148" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="70" y1="80" x2="70" y2="150" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="95" y1="78" x2="88" y2="148" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Ramekin Rim -->
    <ellipse cx="70" cy="75" rx="50" ry="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <!-- Risen Soufflé Crown Puffing Above Rim -->
    <path d="M22 65 C20 30 120 30 118 65 C118 80 22 80 22 65 Z" fill="url(#souffleCake)"/>
    <!-- Molten Chocolate Lava Center Breakthrough -->
    <ellipse cx="70" cy="62" rx="22" ry="10" fill="#1c1917"/>
    <path d="M60 62 Q70 85 75 92" stroke="#000000" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- Powdered Sugar Dusting -->
    <ellipse cx="70" cy="50" rx="35" ry="10" fill="#ffffff" opacity="0.3"/>
  </g>
  <!-- Fresh Raspberry & Mint -->
  <circle cx="230" cy="185" r="9" fill="#e11d48"/>
  <circle cx="234" cy="180" r="3" fill="#be123c"/>
  <path d="M235 178 C242 168 250 174 245 182 Z" fill="#15803d"/>
</svg>
