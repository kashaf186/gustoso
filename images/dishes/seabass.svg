<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="fishPlate" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    <filter id="fShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#fbf9f5"/>
  <!-- Elegant Oval Plate -->
  <ellipse cx="200" cy="150" rx="140" ry="105" fill="url(#fishPlate)" stroke="#cbd5e1" stroke-width="2" filter="url(#fShadow)"/>
  <!-- Saffron Velouté Puree Swoosh -->
  <path d="M120 180 Q200 210 270 140" fill="none" stroke="#fef08a" stroke-width="24" stroke-linecap="round" opacity="0.85"/>
  <!-- Braised Fennel Bulbs -->
  <ellipse cx="160" cy="165" rx="22" ry="12" fill="#dcfce7" transform="rotate(-15 160 165)"/>
  <ellipse cx="240" cy="140" rx="20" ry="10" fill="#dcfce7" transform="rotate(25 240 140)"/>
  <!-- Pan-Seared Crisp-Skin Sea Bass Fillet -->
  <g transform="rotate(-8 200 145)" filter="url(#fShadow)">
    <!-- Flaky white flesh -->
    <path d="M140 135 C155 125 235 125 255 135 C260 155 245 170 235 170 C200 170 150 165 140 135 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Golden Crispy Seared Top Skin -->
    <path d="M140 135 C160 120 235 120 255 135 C250 145 235 148 140 148 Z" fill="#b45309"/>
    <!-- Crispy score marks -->
    <line x1="170" y1="126" x2="165" y2="144" stroke="#78350f" stroke-width="2.5"/>
    <line x1="195" y1="124" x2="190" y2="146" stroke="#78350f" stroke-width="2.5"/>
    <line x1="220" y1="126" x2="215" y2="144" stroke="#78350f" stroke-width="2.5"/>
  </g>
  <!-- Sicilian Capers and Micro Herbs -->
  <circle cx="160" cy="140" r="4" fill="#3f6212"/>
  <circle cx="230" cy="165" r="4.5" fill="#3f6212"/>
  <circle cx="210" cy="185" r="3.5" fill="#3f6212"/>
  <path d="M195 125 C190 115 205 110 208 120 Z" fill="#15803d"/>
</svg>
