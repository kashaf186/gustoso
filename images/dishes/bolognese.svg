<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="pastaBowl" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </radialGradient>
    <filter id="pShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#fbf9f5"/>
  <!-- Deep Bowl -->
  <circle cx="200" cy="150" r="125" fill="url(#pastaBowl)" stroke="#e2e8f0" stroke-width="2" filter="url(#pShadow)"/>
  <circle cx="200" cy="150" r="95" fill="#f1f5f9"/>
  <!-- Entangled Tagliatelle Ribbons -->
  <g fill="none" stroke="#fde047" stroke-width="6" stroke-linecap="round">
    <path d="M140 150 Q160 120 190 140 T230 130 T260 150"/>
    <path d="M150 170 Q180 190 210 160 T250 175"/>
    <path d="M135 135 Q170 165 210 145 T255 135"/>
    <path d="M165 125 Q200 110 235 140 T250 165"/>
    <path d="M145 155 Q180 135 220 175 T265 155"/>
  </g>
  <!-- Rich Braised Meat Ragù -->
  <ellipse cx="200" cy="150" rx="45" ry="35" fill="#991b1b" filter="url(#pShadow)"/>
  <circle cx="180" cy="140" r="12" fill="#7f1d1d"/>
  <circle cx="215" cy="145" r="14" fill="#7f1d1d"/>
  <circle cx="195" cy="165" r="11" fill="#7f1d1d"/>
  <circle cx="210" cy="160" r="10" fill="#b91c1c"/>
  <!-- Parmigiano-Reggiano Shavings (white/cream flakes) -->
  <rect x="180" y="130" width="16" height="5" rx="2" fill="#fef08a" transform="rotate(25 180 130)"/>
  <rect x="210" y="140" width="18" height="6" rx="2" fill="#fffbeb" transform="rotate(-30 210 140)"/>
  <rect x="190" y="155" width="15" height="5" rx="2" fill="#fef08a" transform="rotate(10 190 155)"/>
  <!-- Fresh Basil Sprig on top -->
  <path d="M198 135 C190 120 205 110 215 125 C208 132 202 135 198 135 Z" fill="#16a34a"/>
  <path d="M200 135 C208 122 225 128 215 140 Z" fill="#22c55e"/>
</svg>
