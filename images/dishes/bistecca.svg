<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="steakSear" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="60%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </radialGradient>
    <filter id="stkShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#fbf9f5"/>
  <!-- Rustic Dark Cast Iron / Slate Platter -->
  <rect x="70" y="55" width="260" height="190" rx="18" fill="#18181b" stroke="#27272a" stroke-width="3" filter="url(#stkShadow)"/>
  <!-- Rosemary Roasted Baby Potatoes -->
  <circle cx="110" cy="110" r="14" fill="#d97706"/>
  <circle cx="130" cy="95" r="12" fill="#b45309"/>
  <circle cx="105" cy="135" r="13" fill="#ca8a04"/>
  <!-- Charred Lemon Half -->
  <circle cx="280" cy="180" r="18" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>
  <circle cx="280" cy="180" r="14" fill="#fef08a"/>
  <line x1="266" y1="180" x2="294" y2="180" stroke="#713f12" stroke-width="2"/>
  <line x1="280" y1="166" x2="280" y2="194" stroke="#713f12" stroke-width="2"/>
  <!-- Thick Tuscan T-Bone Steak Cut -->
  <path d="M140 140 C140 100 200 95 240 110 C270 120 270 160 250 185 C220 215 160 200 140 170 Z" fill="url(#steakSear)" filter="url(#stkShadow)"/>
  <!-- T-Bone Bone -->
  <path d="M185 110 L195 180 M185 130 L160 135" stroke="#f1f5f9" stroke-width="6" stroke-linecap="round"/>
  <!-- Charred Oak Grill Marks -->
  <g stroke="#09090b" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <line x1="160" y1="110" x2="210" y2="175"/>
    <line x1="180" y1="105" x2="230" y2="170"/>
    <line x1="205" y1="110" x2="250" y2="165"/>
    <line x1="225" y1="120" x2="260" y2="160"/>
  </g>
  <!-- Melting Rosemary Garlic Compound Butter -->
  <ellipse cx="205" cy="140" rx="14" ry="9" fill="#fef08a" opacity="0.9"/>
  <!-- Flaky Sea Salt specks -->
  <circle cx="195" cy="135" r="1.5" fill="#ffffff"/>
  <circle cx="215" cy="145" r="1.5" fill="#ffffff"/>
  <circle cx="225" cy="130" r="1.5" fill="#ffffff"/>
  <!-- Rosemary sprig -->
  <path d="M195 145 Q225 155 240 140" stroke="#15803d" stroke-width="2.5" fill="none"/>
</svg>
