  <circle cx="145" cy="180" r="14" fill="#f59e0b"/>
  <circle cx="260" cy="135" r="17" fill="#dc2626"/>
  <circle cx="245" cy="175" r="16" fill="#f97316"/>
  <circle cx="190" cy="225" r="15" fill="#ef4444"/>
  <!-- Central Luscious Burrata Pouch -->
  <path d="M165 170 C155 135 170 115 195 110 C205 105 210 105 220 112 C245 120 255 140 245 175 C235 200 175 198 165 170 Z" fill="url(#burrataGrad)" filter="url(#shadow3)"/>
