<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="cPlateGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    <filter id="canShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#fbf9f5"/>
  <circle cx="200" cy="150" r="120" fill="url(#cPlateGrad)" stroke="#cbd5e1" stroke-width="2" filter="url(#canShadow)"/>
  <!-- Powdered Sugar Dusting -->
  <circle cx="150" cy="120" r="10" fill="#ffffff" opacity="0.8"/>
  <circle cx="250" cy="180" r="14" fill="#ffffff" opacity="0.8"/>
  <!-- Cannolo 1 (Back) -->
  <g transform="rotate(30 180 140)" filter="url(#canShadow)">
    <rect x="130" y="130" width="120" height="34" rx="17" fill="#b45309" stroke="#78350f" stroke-width="2"/>
    <ellipse cx="130" cy="147" rx="14" ry="17" fill="#fffbeb"/>
    <ellipse cx="250" cy="147" rx="14" ry="17" fill="#fffbeb"/>
    <!-- Pistachio pieces on tips -->
    <circle cx="126" cy="145" r="4" fill="#65a30d"/>
    <circle cx="254" cy="148" r="4" fill="#65a30d"/>
  </g>
  <!-- Cannolo 2 (Front) -->
  <g transform="rotate(-15 210 160)" filter="url(#canShadow)">
    <rect x="130" y="145" width="135" height="38" rx="19" fill="#d97706" stroke="#92400e" stroke-width="2.5"/>
    <!-- Fried Blister details on shell -->
    <ellipse cx="170" cy="158" rx="5" ry="3" fill="#b45309"/>
    <ellipse cx="205" cy="162" rx="6" ry="4" fill="#b45309"/>
    <ellipse cx="230" cy="155" rx="4" ry="3" fill="#b45309"/>
    <!-- Ricotta cream spilling from left opening -->
    <ellipse cx="130" cy="164" rx="16" ry="19" fill="#fffbeb"/>
    <!-- Ricotta cream spilling from right opening -->
    <ellipse cx="265" cy="164" rx="16" ry="19" fill="#fffbeb"/>
    <!-- Crushed Bronte Pistachios & Candied Orange -->
    <circle cx="125" cy="160" r="4.5" fill="#65a30d"/>
    <circle cx="128" cy="170" r="4" fill="#84cc16"/>
    <circle cx="135" cy="163" r="3.5" fill="#f97316"/>
    <circle cx="268" cy="160" r="4.5" fill="#65a30d"/>
    <circle cx="270" cy="170" r="4" fill="#84cc16"/>
    <circle cx="262" cy="166" r="3.5" fill="#1c1917"/>
    <!-- Powdered sugar dust on shell -->
    <ellipse cx="195" cy="152" rx="20" ry="4" fill="#ffffff" opacity="0.6"/>
  </g>
</svg>
