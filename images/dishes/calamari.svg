<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="ringGold" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </radialGradient>
    <filter id="cShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#fbf9f5"/>
  <circle cx="200" cy="150" r="120" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" filter="url(#cShadow)"/>
  <!-- Dipping Sauce Cup -->
  <circle cx="200" cy="150" r="32" fill="#ef4444" stroke="#dc2626" stroke-width="3" filter="url(#cShadow)"/>
  <circle cx="200" cy="150" r="26" fill="#b91c1c"/>
  <circle cx="200" cy="150" r="6" fill="#fca5a5" opacity="0.6"/>
  <!-- Calamari Rings stacked around -->
  <!-- Ring 1 -->
  <circle cx="140" cy="115" r="24" fill="none" stroke="url(#ringGold)" stroke-width="14" filter="url(#cShadow)"/>
  <!-- Ring 2 -->
  <circle cx="260" cy="115" r="25" fill="none" stroke="url(#ringGold)" stroke-width="14" filter="url(#cShadow)"/>
  <!-- Ring 3 -->
  <circle cx="130" cy="180" r="26" fill="none" stroke="url(#ringGold)" stroke-width="14" filter="url(#cShadow)"/>
  <!-- Ring 4 -->
  <circle cx="265" cy="185" r="23" fill="none" stroke="url(#ringGold)" stroke-width="14" filter="url(#cShadow)"/>
  <!-- Ring 5 -->
  <circle cx="190" cy="90" r="22" fill="none" stroke="url(#ringGold)" stroke-width="13" filter="url(#cShadow)"/>
  <!-- Ring 6 -->
  <circle cx="205" cy="215" r="24" fill="none" stroke="url(#ringGold)" stroke-width="13" filter="url(#cShadow)"/>
  <!-- Lemon Wedges -->
  <path d="M100 135 A 25 25 0 0 1 125 110 L100 110 Z" fill="#facc15" stroke="#eab308" stroke-width="2"/>
  <path d="M295 140 A 25 25 0 0 0 270 165 L295 165 Z" fill="#facc15" stroke="#eab308" stroke-width="2"/>
  <!-- Parsley sprinkle -->
  <circle cx="160" cy="120" r="2.5" fill="#15803d"/>
  <circle cx="240" cy="140" r="2.5" fill="#16a34a"/>
  <circle cx="150" cy="175" r="2.5" fill="#22c55e"/>
</svg>
